<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw into the iPhone notch/home-bar
         zones; the CSS safe-area vars then pad content back out of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Colour Impressions</title>

    <!-- App icon + install metadata. Assets live in client/public, so Vite copies
         them to the dist root and Vercel serves them ahead of the SPA rewrite. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the top of the body gradient in index.css so the status bar blends in. -->
    <meta name="theme-color" content="#E9EDF6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Colour Impressions" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- STALE-BUILD RECOVERY — must stay ABOVE the tags Vite injects below, so
         the listener is attached before the stylesheet and the app module start
         loading.

         A plant tablet sits on one page for a whole shift. When a deploy lands,
         that page is still asking for the previous build's hashed assets, and
         they are gone. What the reader got was the Live Floor with real figures
         and no stylesheet at all — unreadable, and easy to mistake for the app
         having died. If the app module is the file that is missing instead, the
         screen simply stays blank.

         Resource load failures do not bubble, so this listens in the CAPTURE
         phase; `vite:preloadError` covers the lazily-imported route chunks,
         which fail as a rejected promise rather than an element error. The
         reload happens ONCE per session — the document is served
         must-revalidate, so one reload is enough to pick up the current build,
         and a genuinely broken deploy must not put the floor in a reload loop.
         main.jsx clears the flag once the app boots, so the next deploy is
         recovered the same way. -->
    <script>
      (function () {
        var KEY = 'ci:stale-build-reload';
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) { return; }
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || el === window) return;
          if (el.tagName === 'SCRIPT' || (el.tagName === 'LINK' && el.rel === 'stylesheet')) recover();
        }, true);
        window.addEventListener('vite:preloadError', recover);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
