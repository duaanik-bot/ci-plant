<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw into the iPhone notch/home-bar
         zones; the CSS safe-area vars then pad content back out of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Colour Impressions</title>

    <!-- App icon + install metadata. Assets live in client/public, so Vite copies
         them to the dist root and Vercel serves them ahead of the SPA rewrite. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the top of the body gradient in index.css so the status bar blends in. -->
    <meta name="theme-color" content="#E9EDF6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Colour Impressions" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- STALE-BUILD RECOVERY — must stay ABOVE the tags Vite injects below, so
         the listener is attached before the stylesheet and the app module start
         loading.

         A plant tablet sits on one page for a whole shift. When a deploy lands,
         that page is still asking for the previous build's hashed assets, and
         they are gone. The reader got Live Floor with real figures and no
         stylesheet at all — unreadable, and easy to mistake for the app having
         died. If the app module is the file that is missing instead, the screen
         simply stays blank.

         Resource load failures do not bubble, so this listens in the CAPTURE
         phase; `vite:preloadError` covers the lazily-imported route chunks,
         which fail as a rejected promise rather than an element error.

         The attempt budget is the whole safety argument, and the first version
         of it was WRONG in a way that took down a Printing tablet. It used a
         single "already tried" flag that main.jsx cleared on every successful
         boot — but the shell booting is not the app working. A shell that boots
         and THEN fails to fetch a route chunk cleared the flag, reloaded, booted,
         cleared the flag again, and reloaded roughly seventy times a second.
         Nothing clears the budget now: a fixed number of attempts inside a time
         window, which lapses on its own so the next deploy is recovered the same
         way. Two reloads and a broken screen is a bad outcome; an endless reload
         is a worse one, and the floor cannot tell you which it is looking at.

         `sessionStorage` throws outright on a device with site data restricted,
         and the first version treated that as "do nothing" — a guard that is
         silently inert on exactly the locked-down tablets a plant hands out.
         Navigation Timing needs no permission and still bounds us to one retry.

         A plain reload is NOT enough on its own, and that is how the office's
         Print Planning sat unstyled after the 2026-10-27 deploy with this guard
         in place. Vercel sends `max-age=31536000, immutable` on an /assets 404
         too, so a request that lands mid-deploy stores the 404 in the browser
         cache for a year — and both reloads were served that same cached 404.
         So before reloading we re-request every failed asset with
         `cache: 'reload'`, which goes to the network and overwrites the poisoned
         entry. Only same-origin /assets files are touched, the wait is capped,
         and the reload happens whether or not the refetch worked. -->
    <script>
      (function () {
        var KEY = 'ci:stale-build-reload';
        var WINDOW_MS = 60000;   // one incident's worth of time
        var MAX_TRIES = 2;       // reloads allowed inside it
        var HEAL_WAIT_MS = 4000; // longest we hold the reload for the refetch

        function assetPath(u) {
          try {
            var url = new URL(u, location.href);
            return url.origin === location.origin && url.pathname.indexOf('/assets/') === 0 ? url.href : null;
          } catch (e) { return null; }
        }

        // The asset that fired the error, plus anything else this page got a
        // 4xx/5xx for — a lazy chunk usually fails on a DEPENDENCY it imports,
        // and only Resource Timing knows which one that was.
        function failedAssets(first) {
          var seen = {}, out = [];
          function add(u) { var p = u && assetPath(u); if (p && !seen[p]) { seen[p] = 1; out.push(p); } }
          add(first);
          try {
            performance.getEntriesByType('resource').forEach(function (r) {
              if (r.responseStatus >= 400) add(r.name);
            });
          } catch (e) {}
          return out;
        }

        function reloadFresh(first) {
          var urls = failedAssets(first);
          if (!urls.length || !window.fetch) { location.reload(); return; }
          var done = false;
          function go() { if (!done) { done = true; location.reload(); } }
          setTimeout(go, HEAL_WAIT_MS);
          Promise.all(urls.map(function (u) {
            return fetch(u, { cache: 'reload', credentials: 'same-origin' }).catch(function () {});
          })).then(go, go);
        }

        // null means storage is unusable — a different, weaker path below.
        function budget() {
          try {
            var raw = sessionStorage.getItem(KEY);
            if (!raw) return { n: 0, t: 0 };
            var r = JSON.parse(raw);
            return { n: Number(r.n) || 0, t: Number(r.t) || 0 };
          } catch (e) { return null; }
        }

        var started = false;   // one heal per document, however many assets fail

        function recover(failedUrl) {
          if (started) return;
          var now = Date.now();
          var b = budget();

          if (b === null) {
            // No way to record an attempt. Navigation Timing still knows whether
            // THIS document is itself a reload, which allows exactly one retry
            // and can never loop.
            try {
              var nav = performance.getEntriesByType('navigation')[0];
              if (nav && nav.type === 'reload') return;
            } catch (e) { return; }
            started = true;
            reloadFresh(failedUrl);
            return;
          }

          if (!b.t || now - b.t > WINDOW_MS) b = { n: 0, t: now };
          if (b.n >= MAX_TRIES) return;
          b.n += 1;
          try { sessionStorage.setItem(KEY, JSON.stringify(b)); } catch (e) { return; }
          started = true;
          reloadFresh(failedUrl);
        }

        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || el === window) return;
          if (el.tagName === 'SCRIPT') recover(el.src);
          else if (el.tagName === 'LINK' && el.rel === 'stylesheet') recover(el.href);
        }, true);
        window.addEventListener('vite:preloadError', function (e) {
          // "Failed to fetch dynamically imported module: <url>" /
          // "Unable to preload CSS for <url>" — the URL is the last word.
          var msg = String((e && e.payload && e.payload.message) || '');
          var m = msg.match(/(\S+\.(?:js|css))\s*$/);
          recover(m ? m[1] : null);
        });
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
